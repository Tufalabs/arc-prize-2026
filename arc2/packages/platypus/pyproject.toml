[project]
name = "platypus"
version = "0.1.0"
description = "Agent contract and hosting machinery for ARC-AGI2"
requires-python = "==3.12.12"
dependencies = [
    "taaf",
    "ullm",
    "numpy>=2.0.0",
    "psutil>=5.9",
]

[tool.uv.sources]
taaf = { workspace = true }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
platypus = ["viewer_app.html"]
