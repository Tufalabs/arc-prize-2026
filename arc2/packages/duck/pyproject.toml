[project]
name = "duck"
version = "0.1.0"
description = "The duck: an LLM solver for ARC-AGI2, on the platypus agent contract"
requires-python = "==3.12.12"
dependencies = [
    "taaf",
    "platypus",
    "ullm",
    "numpy>=2.0.0",
    "regex>=2024.0",
]

[tool.uv.sources]
taaf = { workspace = true }
platypus = { workspace = true }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The bundled DejaVu files are data, so a wheel build drops them unless they
# are named. Workspace installs are editable and read them from the source
# tree, which is why nothing local notices.
[tool.setuptools.package-data]
"duck.fonts" = ["*.ttf", "LICENSE_DEJAVU"]
