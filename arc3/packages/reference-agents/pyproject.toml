[project]
name = "reference-agents"
version = "0.1.0"
description = "Reference/baseline agents for the platypus harness"
requires-python = "==3.12.12"
dependencies = [
    "numpy",
    "platypus",
    "ullm",
]

[tool.uv.sources]
platypus = { workspace = true }
ullm = { workspace = true }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
