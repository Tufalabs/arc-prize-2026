[project]
name = "sweeper"
version = "0.1.0"
description = "Parameter sweeping: one run, several agent configurations"
requires-python = "==3.12.12"
dependencies = [
    "platypus",
]

[project.optional-dependencies]
# The worked example sweeps the random reference agent. The mechanism itself
# knows about no agent, and must not: it wraps whatever it is handed.
example = ["reference-agents"]

[tool.uv.sources]
platypus = { workspace = true }
reference-agents = { workspace = true }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
